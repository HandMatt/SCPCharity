{{/* Site-wide pre-footer CTA — replaces footer Donate button */}}
<section class="scp-band scp-band--cta scp-reveal" data-reveal aria-labelledby="get-involved-heading">

    <p class="scp-band__eyebrow scp-band__eyebrow--on-cta">Get involved</p>
